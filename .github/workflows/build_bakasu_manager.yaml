name: Build custom BakaSU Manager
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'manager versionCode override'
        required: false
        default: '35337'

jobs:
  build:
    name: Build BakaSU manager APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout build assets
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/manager

      - name: Checkout BakaSU (our fork)
        uses: actions/checkout@v6
        with:
          repository: one899/BakaSU-ColorArchive
          ref: main
          path: bakasu
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK (use preinstalled)
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SDKMAN=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" --install "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" 2>&1 | tail -6

      - name: Patch manager version
        run: |
          cd bakasu
          grep -n 'managerVersionCode' manager/build.gradle.kts
          sed -i "s/extra\[\"managerVersionCode\"\] = 30000 + getGitCommitCount() + 700/extra[\"managerVersionCode\"] = ${{ inputs.version_code }}/" manager/build.gradle.kts
          grep -n 'managerVersionCode' manager/build.gradle.kts

      - name: Restore keystore
        run: |
          base64 -d .github/manager/ksu-release.jks.b64 > /tmp/ksu.jks
          keytool -list -keystore /tmp/ksu.jks -storepass one899ksu 2>&1 | head -4

      - name: Build release APK
        env:
          KEYSTORE_FILE: /tmp/ksu.jks
          KEYSTORE_PASSWORD: one899ksu
          KEY_ALIAS: ksu
          KEY_PASSWORD: one899ksu
        run: |
          cd bakasu
          cd manager
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PKEYSTORE_FILE="$KEYSTORE_FILE" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" 2>&1 | tail -50
          ls -l app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Inject libksud.so + sign with our keystore
        env:
          KS_PASS: one899ksu
          KS_ALIAS: ksu
        run: |
          set -x
          BT=$(ls -d "$ANDROID_HOME/build-tools/"*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          APK=$(find bakasu -name '*-arm64-v8a-release.apk' | head -1)
          echo "base apk: $APK"
          # 1) 从官方 APK 取 libksud.so（BakaSU 官方 CI 用 cargo 编出来塞进去的）
          curl -sSL -o official.apk "https://github.com/Baka-SU/BakaSU/releases/download/v4.2.0-rc3/ReSukiSU_v4.2.0-rc3_35171-arm64-v8a-release.apk"
          mkdir -p libs && unzip -o -q official.apk 'lib/*' -d libs
          ls -l libs/lib/*/ | head -20
          # 2) 注入到我们的 APK
          rm -rf workapk && mkdir workapk && cd workapk
          unzip -q "../$APK"
          mkdir -p lib/arm64-v8a
          cp -f ../libs/lib/arm64-v8a/libksud.so lib/arm64-v8a/libksud.so
          ls -l lib/arm64-v8a/libksud.so
          rm -rf META-INF
          zip -qr ../injected.apk .
          cd ..
          ls -l injected.apk
          # 3) zipalign + 用我们的 keystore 签名
          "${BT}zipalign" -f -p 4 injected.apk aligned.apk
          "${BT}apksigner" sign --ks /tmp/ksu.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --out bakasu-manager-signed.apk aligned.apk
          "${BT}apksigner" verify --print-certs bakasu-manager-signed.apk | head -10
          ls -l bakasu-manager-signed.apk
      - name: Compute signature size/hash
        run: |
          set -x
          ls -l bakasu-manager-signed.apk || true
          for f in bakasu-manager-signed.apk; do
            echo "=== $f"
            python3 .github/manager/apk_sig_hash.py "$f" || true
          done

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: bakasu-manager-custom
          path: bakasu-manager-signed.apk