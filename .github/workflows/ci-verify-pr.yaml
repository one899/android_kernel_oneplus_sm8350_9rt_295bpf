name: CI - verify PR changes

on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile changed files, then full build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout kernel source under test
        uses: actions/checkout@v6
        with:
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout vendor/device trees (kernel/ symlinks depend on them)
        uses: actions/checkout@v6
        with:
          repository: JackA1ltman/android_kernel_modules_and_devicetree_oneplus_sm8350
          ref: oneplus/sm8350_b_16.0.0_oneplus9rt
          path: temp_modules

      - name: Place vendor and device
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules
          echo "--- workspace layout ---"
          ls -la
          echo "--- symlink check ---"
          ls -l kernel/msm-5.4/kernel/sched_assist
          ls kernel/msm-5.4/kernel/sched_assist | head
          echo "--- broken symlinks in kernel tree (should be empty) ---"
          cd kernel/msm-5.4
          find . -xtype l | head -50
          echo "--- end ---"

      - name: Show commits under test
        run: |
          cd kernel/msm-5.4
          git log --oneline -15
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 zip unzip cpio kmod rsync wget curl git \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler libxml2-utils dwarves lz4 zstd

      - name: Fetch clang r383902 toolchain
        run: |
          mkdir -p compiler && cd compiler
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
            "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" \
            -o clang.tar.gz
          mkdir -p clang-bin
          tar -xzf clang.tar.gz -C clang-bin
          rm -f clang.tar.gz
          ./clang-bin/bin/clang --version

      - name: make 9rt_defconfig
        run: |
          cd kernel/msm-5.4
          export PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC=clang LLVM=1 9rt_defconfig

      - name: Compile changed translation units
        run: |
          cd kernel/msm-5.4
          export PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC=clang LLVM=1 -j"$(nproc)" \
            kernel/fork.o \
            kernel/pid.o \
            kernel/pid_namespace.o \
            kernel/sys.o \
            fs/file.o \
            fs/proc/base.o \
            drivers/tty/tty_ioctl.o

      - name: Full kernel build (informational)
        continue-on-error: true
        run: |
          cd kernel/msm-5.4
          export PATH="$GITHUB_WORKSPACE/compiler/clang-bin/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC=clang LLVM=1 -j"$(nproc)"
