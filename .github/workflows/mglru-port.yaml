name: MGLRU port v2
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/triggers/mglru"

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/eevdf-optimized
          fetch-depth: 0

      - name: Branch
        run: |
          git config user.name mglru-ci
          git config user.email ci@users.noreply.github.com
          git checkout -B feat/mglru

      - name: Resolve + download patches
        run: |
          set -e
          P=22241
          API="https://git.codelinaro.org/api/v4/projects/$P/repository/commits"
          mkdir -p /tmp/p && cd /tmp/p
          LIST="d5b2fa1c 37397878 0182f92a 7f53b0e7 a8a158aa baeb9a00 430499cf 4983c526 642d9866 578a3a3d 3c6c3597 df91dc96 79e66eaa 4fc3ef46 a5998f93 cb3958d0 a3eb6516 f8b57162 f7909cbd 18580efd 522c6b9c 397665b3 e4d3bd98 bf03a7c9 12fb1c3e 0f986fae a845525d"
          n=0
          for s in $LIST; do
            n=$((n+1))
            FULL=$(curl -sS "$API/$s" | sed -n "s/.*\"id\":\"\([0-9a-f]\{40\}\)\".*/\1/p" | head -1)
            if [ -z "$FULL" ]; then FULL=$s; fi
            curl -sSL -o "$(printf %02d $n)-$s.patch" "https://git.codelinaro.org/clo/la/kernel/msm-5.4/-/commit/$FULL.patch"
          done
          ls -l | awk "{print \$5, \$9}" | sort -n | head -8
          echo "total patches: $(ls *.patch | wc -l)"

      - name: Apply with git apply
        run: |
          OK=0; BAD=""
          for p in /tmp/p/*.patch; do
            if git apply --reject --whitespace=nowarn "$p" 2>/tmp/e.log; then
              OK=$((OK+1)); echo "OK   $(basename $p)"; git add -A; git commit -qm "$(basename $p .patch)" || true
            else
              echo "FAIL $(basename $p)"; head -6 /tmp/e.log
              BAD="$BAD $(basename $p)"
              find . -name "*.rej" -delete 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              git clean -fdq 2>/dev/null || true
            fi
          done
          echo "OK=$OK BAD=$BAD"
          echo "OK=$OK" >> $GITHUB_ENV
          echo "BAD=$BAD" >> $GITHUB_ENV

      - name: Diff stat
        run: |
          git log --oneline -20 || true
          git diff --stat HEAD~${OK:-1} 2>/dev/null | tail -5 || true

      - name: Push
        run: git push -f origin feat/mglru || echo push-failed

      - name: Summary
        if: always()
        run: |
          echo "### MGLRU port" >> $GITHUB_STEP_SUMMARY
          echo "- applied: ${OK:-0} / 27" >> $GITHUB_STEP_SUMMARY
          echo "- failed: ${BAD:-none}" >> $GITHUB_STEP_SUMMARY
