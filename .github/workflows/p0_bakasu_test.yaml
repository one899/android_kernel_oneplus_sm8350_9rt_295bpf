name: P0 - 9RT BakaSU LKM test

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "上传到 R2 与 GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-lkm:
    name: Compile BakaSU kernelsu.ko (LKM)
    runs-on: ubuntu-24.04
    steps:
      - name: Make Build Environment
        timeout-minutes: 25
        run: |
          set -x
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::http::Pipeline-Depth=0 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Dpkg::Options::=--force-confold \
            kmod cpio binutils binutils-aarch64-linux-gnu bc bison flex build-essential ccache curl git \
            libelf-dev libssl-dev liblz4-tool lzop make python3 rsync unzip wget zip \
            dwarves device-tree-compiler libxml2-utils gcc-aarch64-linux-gnu
          mkdir -p kernel
      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: one899/android_kernel_modules_and_devicetree_oneplus_sm8350
          path: temp_modules
          ref: oneplus/sm8350_b_16.0.0_oneplus9rt

      - name: Prepare Compiler
        run: |
          mkdir -p compiler
          cd compiler
          
          curl -fL "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-bin
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm clang-r383902.tar.gz
      - name: Handle Dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules
      - name: Set Release Info & Custom Version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: rekernel
        run: |
          cd kernel/msm-5.4
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh" -o rekernel_patches.sh
          chmod +x rekernel_patches.sh
          bash rekernel_patches.sh
          mkdir -p drivers/rekernel
          curl https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch -o rekernel_extra.patch
          patch -p1 < rekernel_extra.patch || true
          
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-p0-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-p0-${{ github.ref_name }}-
            ccache-p0-
            ccache-

      - name: Configure ccache
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          ccache --zero-stats || true
          ccache --show-config | head -25

      - name: Restore kernel out (incremental build cache)
        uses: actions/cache/restore@v4
        with:
          path: kernel/msm-5.4/out
          key: kout-p0-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            kout-p0-${{ github.ref_name }}-
            kout-p0-
      - name: Export KSU-needed kernel symbols
        run: |
          cd kernel/msm-5.4
          SYMS="alloc_uid avc_ss_reset avtab_alloc avtab_destroy avtab_insert_nonunique avtab_search_node avtab_search_node_next change_pid do_mount ebitmap_get_bit ebitmap_set_bit ext4_unregister_sysfs free_uid hashtab_insert hashtab_search mntns_operations ns_get_path policydb_write put_seccomp_filter selinux_blob_sizes selinux_state selinux_status_update_policyload selnl_notify_policyload set_fs_pwd strncpy_from_unsafe_user tasklist_lock path_umount task_work_add uts_sem __arm64_sys_umount copy_from_user_nofault copy_to_user_nofault strncpy_from_user_nofault do_syslog init_mm install_session_keyring_to_cred kallsyms_lookup_name kallsyms_lookup ksys_unshare policydb_destroy policydb_load_isids policydb_read selinuxfs_mount __set_fixmap avc_has_perm cond_compute_av context_add_hash current_is_single_threaded ebitmap_cmp ebitmap_contains ebitmap_destroy mls_compute_context_len mls_context_to_sid mls_sid_to_context policydb_context_isvalid security_bounded_transition security_hook_heads sidtab_context_to_sid sidtab_destroy sidtab_search"
          fixed_file() {
            case "$1" in
              __arm64_sys_close)      echo fs/open.c ;;
              __arm64_sys_setns)      echo kernel/nsproxy.c ;;
              __arm64_sys_unshare)    echo kernel/fork.c ;;
              __tracepoint_sys_enter) echo kernel/trace/trace_syscalls.c ;;
              __set_fixmap)           echo arch/arm64/mm/mmu.c ;;
              path_umount)            echo fs/namespace.c ;;
              __arm64_sys_umount)     echo fs/namespace.c ;;
              task_work_add)          echo kernel/task_work.c ;;
              uts_sem)                echo kernel/utsname.c ;;
              tasklist_lock)          echo kernel/fork.c ;;
            esac
          }
          find_def() {
            s="$1"
            for pat in "^[A-Za-z_][A-Za-z0-9_ \*]*[ \*]${s}\(" "^${s}\(" "^[A-Za-z_][A-Za-z0-9_ \*]*[ \*]${s}[ \t]*(=|;)" "^[A-Za-z_][A-Za-z0-9_ \*]*[ \*]${s}[ \t]+[A-Za-z_]"; do
              f=$(grep -rlnE --include='*.c' "$pat" kernel fs mm security net drivers arch 2>/dev/null | head -1)
              if [ -n "$f" ]; then echo "$f"; return 0; fi
            done
            return 0
          }
          export_one() {
            s="$1"
            f="$(fixed_file "$s")"
            if [ -z "$f" ]; then f="$(find_def "$s")"; fi
            if [ -z "$f" ] || [ ! -f "$f" ]; then echo "FAIL $s (not found)"; return 0; fi
            if grep -q "EXPORT_SYMBOL(${s})" "$f"; then echo "SKIP $s (already)"; return 0; fi
            if [ "$s" = "path_umount" ]; then
              printf '\nextern int path_umount(struct path *path, int flags);\n#include <linux/export.h>\nEXPORT_SYMBOL(path_umount);\n' >> "$f"
            else
              printf '\n#include <linux/export.h>\nEXPORT_SYMBOL(%s);\n' "$s" >> "$f"
            fi
            echo "OK   $s -> $f"
            return 0
          }
          for s in __arm64_sys_close __arm64_sys_setns __arm64_sys_unshare __tracepoint_sys_enter; do export_one "$s"; done
          for s in $SYMS; do export_one "$s"; done
          # asm 符号（grep 找不到定义）：直接 extern 声明 + 导出
          printf '\nextern void __flush_dcache_area(void *addr, size_t len);\n#include <linux/export.h>\nEXPORT_SYMBOL(__flush_dcache_area);\n' >> mm/maccess.c
          echo "OK   __flush_dcache_area -> mm/maccess.c"
          # current_is_single_threaded：grep 找不到定义文件，但 fork.c 里有声明，追加导出即可
          if ! grep -q 'EXPORT_SYMBOL(current_is_single_threaded)' kernel/fork.c; then
            printf '\n#include <linux/export.h>\nEXPORT_SYMBOL(current_is_single_threaded);\n' >> kernel/fork.c
            echo "OK   current_is_single_threaded -> kernel/fork.c"
          fi
          printf '\nlong copy_from_user_nofault(void *dst, const void __user *src, size_t size)\n{\n\treturn probe_user_read(dst, src, size);\n}\nlong copy_to_user_nofault(void __user *dst, const void *src, size_t size)\n{\n\treturn probe_user_write(dst, src, size);\n}\nlong strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)\n{\n\treturn strncpy_from_unsafe_user(dst, unsafe_addr, count);\n}\n#include <linux/export.h>\nEXPORT_SYMBOL(copy_from_user_nofault);\nEXPORT_SYMBOL(copy_to_user_nofault);\nEXPORT_SYMBOL(strncpy_from_user_nofault);\n' >> mm/maccess.c
          echo "OK   3x *_user_nofault -> mm/maccess.c"
          echo "=== 头文件是否被误改 ==="
          git status --porcelain | grep -E '\.h$' && echo "!! HEADER MODIFIED" || echo "no header modified (good)"
      - uses: nttld/setup-ndk@v1
        id: ndk
        continue-on-error: true
        with:
          ndk-version: r29
          add-to-path: false

      - name: Build custom ksuinit (.ko override)
        continue-on-error: true
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/ksusrc
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Baka-SU/BakaSU /tmp/ksusrc
          git -C /tmp/ksusrc sparse-checkout set userspace/ksuinit .github/scripts
          SRC=/tmp/ksusrc/userspace/ksuinit
          ls -l "$SRC/src"
          curl -fsSL -o /tmp/ksuinit_override.py "https://raw.githubusercontent.com/one899/android_kernel_oneplus_sm8350_9rt_295bpf/p0/lkm/.github/ksuinit_override.py"
          python3 /tmp/ksuinit_override.py "$SRC/src/init.rs"
          grep -n load_module_preferred "$SRC/src/init.rs" | head -3
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup target add aarch64-linux-android --toolchain nightly
          export ANDROID_NDK_HOME="${{ steps.ndk.outputs.ndk-path }}"
          echo "NDK=$ANDROID_NDK_HOME"
          source /tmp/ksusrc/.github/scripts/setup-rust-build.sh aarch64-linux-android 26
          echo "CLANG_PATH=$CLANG_PATH"
          BUILTINS="$($CLANG_PATH --print-resource-dir)/lib/linux/libclang_rt.builtins-aarch64-android.a"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wno-unused-command-line-argument -C link-arg=$BUILTINS"
          ( cd "$SRC" && cargo +nightly build --package ksuinit --target=aarch64-linux-android --release )
          cp -f "$SRC/target/aarch64-linux-android/release/ksuinit" "$GITHUB_WORKSPACE/ksuinit-custom"
          ls -l "$GITHUB_WORKSPACE/ksuinit-custom"

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK=content
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH="arm64"
          export SUBARCH="arm64"
          cd kernel/msm-5.4
          echo "添加docker补丁中"
          rm fs/overlayfs/util.c
          curl -LSs "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/util.c" -o fs/overlayfs/util.c
          rm kernel/module.c
          curl -LSs "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/module.c" -o kernel/module.c
          rm include/linux/sched/user.h
          curl -LSs https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch -o 001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          curl -LSs https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/user.h -o include/linux/sched/user.h
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          echo "添加docker补丁完成"
          # ==== 跟上游最新 main（KSU 内核取最新修复），并把 SHA 记录下来给管理器用 ====
          KSU_TAG=main
          echo "Using BakaSU ref: $KSU_TAG"
          curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" -o ksu_setup.sh
          bash ksu_setup.sh "$KSU_TAG"
          KSU_SHA=$(cd KernelSU && git rev-parse HEAD)
          echo "KSU commit: $KSU_SHA  count=$(cd KernelSU && git rev-list --count HEAD)"
          echo "KSU_SHA=$KSU_SHA" > ksu_pin.txt
          sed -i 's|pr_info("handle_setresuid|pr_debug("handle_setresuid|' drivers/kernelsu/hook/setuid_hook.c 2>/dev/null || true
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh
          echo "skip syscall_hook_patches.sh (BakaSU uses tracepoint hook)"
          # KSU=m 时内核侧 CONFIG_KSU 未定义（只有 CONFIG_KSU_MODULE），
          # 导致 KSU 内核补丁里的 path_umount 等 helper 被 #ifdef 编译掉。
          for f in fs/namespace.c fs/internal.h; do
            if [ -f "$f" ] && grep -q '#ifdef CONFIG_KSU\b' "$f"; then
              sed -i 's/#ifdef CONFIG_KSU\b/#if defined(CONFIG_KSU) || defined(CONFIG_KSU_MODULE)/g' "$f"
              echo "guard fixed: $f"
            fi
          done
          grep -n 'CONFIG_KSU_MODULE' fs/namespace.c fs/internal.h 2>/dev/null | head -5 || true          # KSU=m 时内核侧 CONFIG_KSU 未定义（只有 CONFIG_KSU_MODULE），补丁里的 path_umount 会被编译掉
          for f in fs/namespace.c fs/internal.h; do
            if [ -f "$f" ] && grep -q '#ifdef CONFIG_KSU\b' "$f"; then
              sed -i 's/#ifdef CONFIG_KSU\b/#if defined(CONFIG_KSU) || defined(CONFIG_KSU_MODULE)/g' "$f"
              echo "guard fixed: $f"
            fi
          done
          sed -i '/ksu_handle_devpts/d' drivers/tty/pty.c
          sed -i 's/obj-$(CONFIG_KPROBES)/obj-y/g' kernel/Makefile
          # 不再打桩：使用 BakaSU 原生 selinux_hide.c（真实 SELinux 上下文隐藏）
          make O=out CC="ccache clang" LLVM=1 9rt_defconfig  
          ./scripts/config --file out/.config \
            -m CONFIG_KSU \
            -e CONFIG_KSU_TRACEPOINT_HOOK \
            -e CONFIG_KSU_MULTI_MANAGER_SUPPORT \
            -d CONFIG_KSU_MANUAL_HOOK
          # ==== Enable namespaces for Droidspaces ====
          ./scripts/config --file out/.config \
            -e CONFIG_USER_NS \
            -e CONFIG_PID_NS \
            -e CONFIG_IPC_NS \
            -e CONFIG_CHECKPOINT_RESTORE \
            -e CONFIG_SYSVIPC \
            -e CONFIG_KPROBES \
            -e CONFIG_FTRACE_SYSCALLS \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_TMPFS_XATTR
          # ==== 9 Pro 充电配置（仅 9p 分支，必须放在 defconfig 之后）====
          if [ "${{ github.ref_name }}" = "test/9pro-charging" ]; then
            echo "=== 应用 9 Pro 充电配置 ==="
            ./scripts/config --file out/.config -e CONFIG_QCOM_POWER_SUPPLY || true
            ./scripts/config --file out/.config -e CONFIG_QPNP_QG || true
            ./scripts/config --file out/.config -e CONFIG_QPNP_SMB5 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_V2 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_VOOCPHY_CHGLIB || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_ADSP_VOOCPHY || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_AP_VOOCPHY || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_MP2762_CHARGER || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_CHARGEPUMP_HL7227 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_WIRELESS_P9415 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_WIRELESS_NU1619 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_VOOCPHY_MASTER_SC8547 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_VOOCPHY_SC8517 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_VOOCPHY_HL7138 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_SMART_CHARGE || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_UFCS_SC2201 || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_UFCS_SC8547A || true
            ./scripts/config --file out/.config --set-val CONFIG_LOG_BUF_SHIFT 23 || true
            ./scripts/config --file out/.config --set-val CONFIG_LOG_CPU_MAX_BUF_SHIFT 18 || true
            ./scripts/config --file out/.config -d CONFIG_OPLUS_CHG_OP9RT_PMIC_VOOCPHY || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_SM8350_CHARGER || true
            ./scripts/config --file out/.config -e CONFIG_OPLUS_CHG_TEST_KIT || true
            ./scripts/config --file out/.config -e CONFIG_POWER_SUPPLY || true
            ./scripts/config --file out/.config -e CONFIG_MFD_SPMI_PMIC || true
            ./scripts/config --file out/.config -e CONFIG_QCOM_SPMI_ADC5 || true
            ./scripts/config --file out/.config -e CONFIG_QTI_BATTERY_CHARGER || true
            ./scripts/config --file out/.config -e CONFIG_TYPEC || true
            ./scripts/config --file out/.config -e CONFIG_TYPEC_UCSI || true
            # 强制编 9 Pro 充电框架
            sed -i 's|+= oplus/$|+= oplus_chg/|' drivers/power/Makefile || true
            # oplus_charger.h 依赖 OPLUS_CHG_OP_DEF
            for f in $(find drivers/power/oplus_chg -name '*.c' -o -name '*.h'); do
              grep -q 'define OPLUS_CHG_OP_DEF' "$f" 2>/dev/null || \
                sed -i '1i #ifndef OPLUS_CHG_OP_DEF\n#define OPLUS_CHG_OP_DEF 1\n#endif' "$f"
            done
            echo "OP_DEF files: $(grep -rl 'define OPLUS_CHG_OP_DEF' drivers/power/oplus_chg | wc -l)"
            echo "=== 生效后的关键配置 ==="
            ./scripts/config --file out/.config --state CONFIG_QPNP_QG || true
            ./scripts/config --file out/.config --state CONFIG_OPLUS_CHG || true
          fi
          # ==========================================
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_IO
          ./scripts/config --file out/.config --enable CONFIG_CPUSETS
          ./scripts/config --file out/.config --enable CONFIG_MEMCG
          ./scripts/config --file out/.config --enable CONFIG_DEVTMPFS
          ./scripts/config --file out/.config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          # ==== kernel release string (MUST stay space free) ====
          # Form: 5.4.295-qgki-ColorArchive-Ultra-<YY.MM.DD of the build date>
          # e.g. a build on 2026-10-15 reports ...-Ultra-26.10.15
          #
          # kernel/module.c same_magic() skips past the first space of vermagic
          # when CONFIG_MODVERSIONS=y, so a space in UTS_RELEASE makes every
          # vendor module mismatch and nothing loads -> boot hang. Keep it
          # space free; the guard below aborts the build if it ever is not.
          KREL_DATE=$(date +%y.%m.%d)
          KREL="5.4.295-qgki-ColorArchive-Ultra-lkm"
          case "$KREL" in
            *" "*) echo "FATAL: kernel release contains a space: $KREL"; exit 1 ;;
          esac
          printf '#!/bin/sh\necho "%s"\n' "-qgki-ColorArchive-Ultra-lkm" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          ./scripts/config --file out/.config --set-str LOCALVERSION ""
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO
          echo "kernel release will be: $KREL"
          # =====================================================

          # ==== 5.4 compat: 5.7+ API names used by kprobe-hook path ====
          # 5.4 的 preempt.h 在 #ifdef MODULE 下 #undef 了 preempt_enable_no_resched* 系列
          # ("Modules have no business playing preemption tricks")，改用 preempt_enable()
          for f in $(grep -rl 'preempt_enable_no_resched' drivers/kernelsu/ 2>/dev/null); do
            grep -q 'linux/preempt.h' "$f" || sed -i '1i #include <linux/preempt.h>' "$f"
          done
          grep -rl 'preempt_enable_no_resched_notrace' drivers/kernelsu/ 2>/dev/null | xargs -r sed -i 's/preempt_enable_no_resched_notrace()/preempt_enable()/g'
          echo "--- compat: 剩余 _notrace 调用数: $(grep -rc 'preempt_enable_no_resched_notrace' drivers/kernelsu/ 2>/dev/null | grep -v ':0' | wc -l)"
          grep -rn 'preempt_enable()' drivers/kernelsu/feature/sucompat.c | head -3
          # ==== 对齐 KSU 版本号到管理器 v3.4.2 (33355) ====
          # Kbuild 用 commit 计数算版本（30000+n+289），legacy 分支算出来是 33315，
          # 与管理器 33355 不一致会提示版本不匹配，这里直接固定。
          KB=drivers/kernelsu/Kbuild
          if [ -f "$KB" ]; then
            sed -i 's/$(eval KSU_VERSION=$(shell expr 30000 + $(KSU_GIT_VERSION) + 289))/$(eval KSU_VERSION=33355)/' "$KB" 2>/dev/null || true
            grep -n 'KSU_VERSION' "$KB" | head -5
          fi
          # ==== BakaSU: pkg_observer 只支持 6.x（fsnotify handle_inode_event / TWA_RESUME），5.4 下移除 ====
          if [ -f drivers/kernelsu/Kbuild ]; then
            sed -i '/manager\/pkg_observer\.o/d' drivers/kernelsu/Kbuild
            printf '#include <linux/kernel.h>\nextern int ksu_observer_init(void);\nextern void ksu_observer_exit(void);\nint ksu_observer_init(void) { return 0; }\nvoid ksu_observer_exit(void) { }\n' > drivers/kernelsu/manager/pkg_observer_stub.c
            sed -i 's|^kernelsu-objs += manager/manager\.o|kernelsu-objs += manager/manager.o\nkernelsu-objs += manager/pkg_observer_stub.o|' drivers/kernelsu/Kbuild
            grep -n 'pkg_observer' drivers/kernelsu/Kbuild || echo "pkg_observer removed + stub added"
          fi
          # ==== 使用我们自签管理器的签名（ColorArchive BakaSU 管理器）====
          echo "KSU_EXPECTED_SIZE=0x365" >> $GITHUB_ENV
          echo "KSU_EXPECTED_HASH=E1F970D85873264FA5FE6EEB4EB30543F1E50A60AF083EB67B11F67824D4BE17" >> $GITHUB_ENV
          echo "manager sig (custom slot) queued for make"
          # ==== 静态加入 ColorArchive 管理器签名（不走 EXPECTED_SIZE 宏，避免影响其它管理器）====
          AS=drivers/kernelsu/manager/apk_sign.c
          if [ -f "$AS" ] && ! grep -q 'E1F970D8' "$AS"; then
            sed -i 's|{ EXPECTED_SIZE_KOWX712, EXPECTED_HASH_KOWX712 }, // KOWX712/KernelSU|{ EXPECTED_SIZE_KOWX712, EXPECTED_HASH_KOWX712 }, // KOWX712/KernelSU\n    { 0x365, "E1F970D85873264FA5FE6EEB4EB30543F1E50A60AF083EB67B11F67824D4BE17" }, // ColorArchive|' "$AS"
            echo "=== patched manager keys ==="
            grep -n -A1 'KOWX712' "$AS" | head -6
          fi
          # ==== 静态加入 ColorArchive 签名（不用 EXPECTED_SIZE 宏）====
          AS=drivers/kernelsu/manager/apk_sign.c
          if [ -f "$AS" ] && ! grep -q 'E1F970D8' "$AS"; then
            sed -i 's|{ EXPECTED_SIZE_KOWX712, EXPECTED_HASH_KOWX712 }, // KOWX712/KernelSU|{ EXPECTED_SIZE_KOWX712, EXPECTED_HASH_KOWX712 }, // KOWX712/KernelSU\n    { 0x365, "E1F970D85873264FA5FE6EEB4EB30543F1E50A60AF083EB67B11F67824D4BE17" }, // ColorArchive|' "$AS"
            echo "=== patched keys ==="; grep -c 'E1F970D8' "$AS"
          fi
          # 隐藏 /proc/modules 里的 kernelsu（仅非 root 不可见）
          python3 .github/kernel_hide_module.py kernel/module.c || echo "hide patch skipped"
          echo "compat done"
          # path_umount: KSU 补丁在 LKM 模式下没把函数体编进内核，vmlinux 链接会 undefined，这里补定义
          if ! grep -qE '^int path_umount\(' fs/namespace.c; then
            printf '\nint path_umount(struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\n\tif (!check_mnt(mnt))\n\t\treturn -EINVAL;\n\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n\t\treturn -EINVAL;\n\tif (!ns_capable(mnt->mnt_ns->user_ns, CAP_SYS_ADMIN))\n\t\treturn -EPERM;\n\treturn do_umount(mnt, flags);\n}\n' >> fs/namespace.c
            echo '=== added fallback path_umount definition ==='
          else
            echo '=== path_umount already defined ==='
          fi
          grep -n 'int path_umount' fs/namespace.c | head -3 || true
          make -k O=out CC="ccache clang" LLVM=1 -j$(nproc) modules
          # ==== 同一次构建顺手产出 Image（arm64: vmlinux 的 raw 二进制，参数与 kbuild 一致）====
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          mkdir -p out/arch/arm64/boot
          llvm-objcopy -O binary -R .note -R .note.gnu.build-id -R .comment -S out/vmlinux out/arch/arm64/boot/Image
          ls -l out/arch/arm64/boot/Image
          md5sum out/arch/arm64/boot/Image
      - name: Pack LKM boot (kernel + ksuinit + kernelsu.ko)
        if: always()
        run: |
          set -x
          IMG=kernel/msm-5.4/out/arch/arm64/boot/Image
          KO=$(find "$GITHUB_WORKSPACE" -name 'kernelsu.ko' | head -1)
          if [ ! -f "$IMG" ] || [ -z "$KO" ]; then echo "missing Image or kernelsu.ko, skip pack"; exit 0; fi
          mkdir -p /tmp/bp && cd /tmp/bp
          wget -q https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/boot_a.img" -o base.img
          if [ -f "$GITHUB_WORKSPACE/ksuinit-custom" ]; then
            cp -f "$GITHUB_WORKSPACE/ksuinit-custom" ksuinit
            echo "=== using CUSTOM ksuinit (metadata override) ==="
          else
            echo "=== using official ksuinit ==="
            curl -fL "https://github.com/tiann/KernelSU/releases/download/v3.3.1/ksuinit-aarch64" -o ksuinit
          fi
          chmod +x ksuinit
          ./magiskboot unpack base.img
          cp "$GITHUB_WORKSPACE/$IMG" kernel
          ./magiskboot cpio ramdisk.cpio "rm init" || true
          ./magiskboot cpio ramdisk.cpio "add 0750 init ksuinit"
          # ==== strip 调试信息：13.5MB -> 约 1-2MB，才能放进 /metadata 做热更新 ====
          STRIP=""
          STRIP=$(command -v llvm-strip 2>/dev/null || true)
          if [ -z "$STRIP" ]; then STRIP=$(ls /usr/lib/llvm-*/bin/llvm-strip 2>/dev/null | head -1 || true); fi
          if [ -z "$STRIP" ]; then STRIP=$(find /usr /opt -name llvm-strip -type f 2>/dev/null | head -1 || true); fi
          echo "strip tool: [$STRIP]"
          cp -f "$KO" /tmp/bp/kernelsu-stripped.ko
          if [ -n "$STRIP" ]; then "$STRIP" --strip-debug /tmp/bp/kernelsu-stripped.ko || echo "strip failed, keep unstripped"; fi
          echo "orig: $(stat -c%s "$KO")  stripped: $(stat -c%s /tmp/bp/kernelsu-stripped.ko)"
          cp -f /tmp/bp/kernelsu-stripped.ko "$GITHUB_WORKSPACE/kernelsu-stripped.ko"
          ./magiskboot cpio ramdisk.cpio "add 0644 kernelsu.ko /tmp/bp/kernelsu-stripped.ko"
          echo "=== ramdisk entries ==="
          ./magiskboot cpio ramdisk.cpio "ls" 2>/dev/null | grep -E "(init$|kernelsu)" || true
          ./magiskboot repack base.img new-boot.img
          md5sum new-boot.img
          cp new-boot.img "$GITHUB_WORKSPACE/boot-lkm-9pro-${BUILD_DATE}.img"
          cd "$GITHUB_WORKSPACE" && ls -l boot-lkm-9pro-*.img
      - name: P0 - dump LKM info
        run: |
          set -x
          KO=$(find "$GITHUB_WORKSPACE" -name 'kernelsu.ko' | head -1)
          if [ -z "$KO" ]; then echo "NO kernelsu.ko FOUND"; find . -name '*.ko' | head -20; exit 1; fi
          echo "KO=$KO" | tee p0_report.txt
          ls -l "$KO" | tee -a p0_report.txt
          echo "=== MODINFO ===" | tee -a p0_report.txt
          modinfo "$KO" 2>&1 | head -30 | tee -a p0_report.txt
          echo "=== UNDEFINED SYMBOLS (count + list) ===" | tee -a p0_report.txt
          readelf -sW "$KO" | awk '$7=="UND" && $8!="" {print $8}' | sed 's/@.*//' | sort -u > und.txt
          wc -l und.txt | tee -a p0_report.txt
          cat und.txt | tee -a p0_report.txt
          echo "=== DEFINED FUNCS (first 20) ===" | tee -a p0_report.txt
          readelf -sW "$KO" | awk '$7!="UND" && $8!="" && $4=="FUNC" {print $8}' | sort -u | head -20 | tee -a p0_report.txt
          echo "=== KERNEL IMAGE ===" | tee -a p0_report.txt
          ls -l kernel/msm-5.4/out/arch/arm64/boot/Image* 2>&1 | tee -a p0_report.txt
          if [ -f kernel/msm-5.4/out/arch/arm64/boot/Image ]; then
            echo "Image md5: $(md5sum kernel/msm-5.4/out/arch/arm64/boot/Image)" | tee -a p0_report.txt
          fi
          echo "=== __versions section size ===" | tee -a p0_report.txt
          readelf -SW "$KO" | grep -E '__versions|\.modinfo' | tee -a p0_report.txt

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-p0-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save kernel out
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kernel/msm-5.4/out
          key: kout-p0-${{ github.ref_name }}-${{ github.run_id }}
      - name: Publish KSU pin for manager build
        if: always()
        run: |
          set -x
          if [ ! -f ksu_pin.txt ]; then echo "no pin file"; exit 0; fi
          mkdir -p .github
          cp ksu_pin.txt .github/ksu_pin.txt
          cat .github/ksu_pin.txt
          git config user.name "colorarchive-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f .github/ksu_pin.txt
          git commit -m "ci: pin KSU $(cat ksu_pin.txt) (kernel build ${GITHUB_RUN_ID})" || true
          git push origin HEAD:p0/lkm || echo "push skipped"
      - name: Publish release (lkm-latest-9pro)
        if: success() && github.ref_name == 'test/9pro-charging' && (github.event_name != 'workflow_dispatch' || inputs.upload == true)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          R="${{ github.repository }}"
          BOOT=$(ls boot-lkm-9pro-*.img 2>/dev/null | head -1 || true)
          KO=$(ls kernelsu-stripped.ko 2>/dev/null | head -1 || true)
          if [ -z "$BOOT" ]; then echo "no boot, skip"; exit 0; fi
          echo "BOOT=$BOOT KO=$KO"
          ls -l "$BOOT" ${KO:-}
          gh release view lkm-latest-9pro --repo "$R" >/dev/null 2>&1 || gh release create lkm-latest-9pro --repo "$R" --title "LKM latest" --notes "auto published by CI" || true
          cp -f "$BOOT" boot-lkm-9pro.img
          gh release upload lkm-latest-9pro --repo "$R" boot-lkm-9pro.img --clobber || true
          gh release upload lkm-latest-9pro --repo "$R" "$BOOT" --clobber || true
          if [ -n "$KO" ]; then gh release upload lkm-latest-9pro --repo "$R" "$KO" --clobber || true; fi
          sha256sum boot-lkm-9pro.img > SHA256SUMS
          if [ -n "$KO" ]; then sha256sum "$KO" >> SHA256SUMS; fi
          gh release upload lkm-latest-9pro --repo "$R" SHA256SUMS --clobber || true
          gh release view lkm-latest-9pro --repo "$R" --json assets -q ".assets[].name" || true
      - name: Upload to Cloudflare R2
        if: always() && github.ref_name == 'test/9pro-charging' && (github.event_name != 'workflow_dispatch' || inputs.upload == true)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -x
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "R2 not configured, skip"; exit 0; fi
          cd "$GITHUB_WORKSPACE"
          KO=$(ls kernelsu-stripped.ko 2>/dev/null | head -1 || true)
          BOOT=$(ls boot-lkm-9pro-*.img 2>/dev/null | head -1 || true)
          if [ -n "$KO" ]; then
            npx -y wrangler@latest r2 object put "$R2_BUCKET/9pro/kernelsu-stripped.ko" --file "$KO" --remote || true
          fi
          if [ -n "$BOOT" ]; then
            cp -f "$BOOT" boot-lkm-9pro.img
            npx -y wrangler@latest r2 object put "$R2_BUCKET/9pro/boot-lkm-9pro.img" --file boot-lkm-9pro.img --remote || true
          fi
          # ==== 版本清单：小程序用它和本地对比 ====
          KSUCOUNT=0
          KSUDIR=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name KernelSU 2>/dev/null | head -1)
          echo "KSUDIR=$KSUDIR"
          if [ -n "$KSUDIR" ]; then KSUCOUNT=$(git -C "$KSUDIR" rev-list --count HEAD 2>/dev/null || echo 0); fi
          KSVER=$((30000 + KSUCOUNT + 700))
          KREL=$(cat kernel/msm-5.4/out/include/config/kernel.release 2>/dev/null || echo unknown)
          EPOCH=$(date +%s)
          BDATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          KO_SHA=$(sha256sum kernelsu-stripped.ko 2>/dev/null | cut -d" " -f1 || echo "")
          KO_SZ=$(stat -c%s kernelsu-stripped.ko 2>/dev/null || echo 0)
          BOOT_SHA=$(sha256sum boot-lkm-9pro.img 2>/dev/null | cut -d" " -f1 || echo "")
          BOOT_SZ=$(stat -c%s boot-lkm-9pro.img 2>/dev/null || echo 0)
          printf '{"device":"lemonadep","model":"LE2120","ko":{"version":"%s","build_epoch":%s,"build_date":"%s","sha256":"%s","size":%s,"name":"kernelsu-stripped.ko"},"boot":{"version":"%s","build_epoch":%s,"build_date":"%s","sha256":"%s","size":%s,"name":"boot-lkm-9pro.img"}}' "$KSVER" "$EPOCH" "$BDATE" "$KO_SHA" "$KO_SZ" "$KREL" "$EPOCH" "$BDATE" "$BOOT_SHA" "$BOOT_SZ" > manifest.json
          cat manifest.json
          npx -y wrangler@latest r2 object put "$R2_BUCKET/9pro/manifest.json" --file manifest.json --remote --content-type application/json || true
          echo "=== r2 list ==="
          npx -y wrangler@latest r2 object list "$R2_BUCKET" --remote || true

      - name: Upload LKM + report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p0-bakasu
          path: |
            ksu_pin.txt
            kernelsu-stripped.ko
            **/kernelsu.ko
            p0_report.txt
            kernel/msm-5.4/out/arch/arm64/boot/Image
            kernel/msm-5.4/out/arch/arm64/boot/Image.gz
            boot-lkm-9pro-*.img